<p-dialog
  header="Edit Profile"
  [modal]="true"
  [style]="{ width: '50rem', height: '50rem' }"
  [(visible)]="visible"
>
  <form action="">
    <!-- nome articolo -->
    <p-floatlabel variant="on">
      <input pInputText id="articolo" autocomplete="off" />
      <label for="on_label">Articolo</label>
    </p-floatlabel>
    <!-- descrizione -->
    <p-floatlabel variant="on">
      <input pInputText type="text" pSize="large" id="descrizione" />
      <label for="on_label">Descrizione</label>
    </p-floatlabel>
    <!--menù categorie -->
    <p-listbox formControlName="selectedCategory" optionLabel="name" class="w-full md:w-56" />
  </form>
</p-dialog>
