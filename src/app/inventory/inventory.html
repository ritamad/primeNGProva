<p-table
  [value]="items()"
  [scrollable]="false"
  sortMode="multiple"
  [globalFilterFields]="['categoria', 'stato']"
>
  <ng-template #header>
    <tr>
      <th>Articolo</th>
      <th pSortableColumn="categoria">Categoria <p-sortIcon field="categoria" /></th>
      <th>Disponibili</th>
      <th>Soglia Minima</th>
      <th pSortableColumn="stato">Stato <p-sortIcon field="stato" /></th>
    </tr>
    <tr>
      <th>
        <p-columnFilter
          type="text"
          field="categoria"
          placeholder="Filtra per categoria..."
          ariaLabel="Filter Name"
          filterOn="input"
        ></p-columnFilter>
      </th>
    </tr>
  </ng-template>
  <ng-template #body let-item>
    <tr>
      <td>{{ item.articolo }}</td>
      <td>{{ item.categoria }}</td>
      <td>{{ item.disponibili }}</td>
      <td>{{ item.sogliaMinima }}</td>
      <td>{{ item.stato }}</td>
    </tr>
  </ng-template>
</p-table>
